<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">DTN Mission Control dashboard preview</title>
  <desc id="desc">Dark operations dashboard showing health cards, a mesh topology, bundle groups, and a node detail drawer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07131e"/><stop offset="1" stop-color="#102b3b"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#163247"/><stop offset="1" stop-color="#0b1c29"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="620" rx="24" fill="url(#bg)"/>
  <rect x="26" y="26" width="180" height="568" rx="16" fill="#091a27" stroke="#1c3a4b"/>
  <g font-family="Arial, sans-serif" fill="#dff4f7"><text x="58" y="73" font-size="21" font-weight="700" letter-spacing="3">DTN</text><text x="58" y="91" font-size="8" fill="#6f98a8" letter-spacing="2">MISSION CONTROL</text></g>
  <g font-family="Arial, sans-serif" font-size="13" fill="#86a5b2"><rect x="45" y="130" width="142" height="39" rx="7" fill="#143447"/><text x="68" y="155" fill="#dff4f7">⌂  Overview</text><text x="68" y="204">◈  Nodes &amp; routes</text><text x="68" y="246">↗  Traffic</text><text x="68" y="288">≋  Event stream</text></g>
  <g font-family="Arial, sans-serif"><text x="239" y="67" fill="#6b8e9e" font-size="9" letter-spacing="2">OPERATIONS / LOCAL MESH</text><text x="239" y="96" fill="#effcff" font-size="28" font-weight="700">Mission control</text><text x="239" y="119" fill="#7f9daa" font-size="12">Service health, bundle flow, and route visibility across the local mesh.</text></g>
  <g>
    <rect x="239" y="149" width="200" height="100" rx="9" fill="url(#panel)" stroke="#38bdf8" stroke-opacity=".4"/><rect x="455" y="149" width="200" height="100" rx="9" fill="url(#panel)" stroke="#4ade80" stroke-opacity=".4"/><rect x="671" y="149" width="200" height="100" rx="9" fill="url(#panel)" stroke="#fb923c" stroke-opacity=".4"/>
    <g font-family="Arial, sans-serif" fill="#89a7b2" font-size="9"><text x="258" y="174">NODES ONLINE</text><text x="474" y="174">SERVICES HEALTHY</text><text x="690" y="174">BUNDLES / HOUR</text></g>
    <g font-family="Arial, sans-serif" fill="#edfbff" font-size="31" font-weight="700"><text x="258" y="213">4 / 6</text><text x="474" y="213">16</text><text x="690" y="213">1,205</text></g>
  </g>
  <rect x="239" y="268" width="632" height="230" rx="10" fill="url(#panel)" stroke="#1c3e50"/>
  <g font-family="Arial, sans-serif"><text x="260" y="298" fill="#eefbfe" font-size="15" font-weight="700">Network topology</text><text x="260" y="318" fill="#7896a3" font-size="10">Observed hosts and DTN nodes, including nodes beyond the gateway.</text></g>
  <g stroke="#39758a" stroke-opacity=".8" stroke-width="2" stroke-dasharray="5 7"><path d="M380 398 L540 355"/><path d="M540 355 L745 395"/></g><g stroke="#39758a" stroke-width="2"><path d="M380 420 L540 355"/><path d="M380 370 L540 355"/></g>
  <g filter="url(#glow)"><circle cx="380" cy="370" r="18" fill="#0e3341" stroke="#4ade80"/><circle cx="380" cy="420" r="18" fill="#0e3341" stroke="#4ade80"/><circle cx="540" cy="355" r="22" fill="#0e3341" stroke="#38bdf8"/><circle cx="745" cy="395" r="18" fill="#281e48" stroke="#a78bfa"/></g>
  <g font-family="Arial, sans-serif" font-size="10" text-anchor="middle"><text x="380" y="400" fill="#dff4f7">edge-node-a</text><text x="380" y="450" fill="#dff4f7">edge-node-b</text><text x="540" y="389" fill="#dff4f7">gateway</text><text x="745" y="425" fill="#dff4f7">remote-07</text></g>
  <rect x="888" y="26" width="286" height="568" rx="16" fill="#0b1c29" stroke="#31576b"/><g font-family="Arial, sans-serif"><text x="916" y="68" fill="#6b8e9e" font-size="9" letter-spacing="2">NODE DETAILS</text><text x="916" y="102" fill="#effcff" font-size="25" font-weight="700">remote-07</text><circle cx="922" cy="129" r="4" fill="#4ade80"/><text x="934" y="133" fill="#4ade80" font-size="10">ONLINE</text><text x="916" y="170" fill="#668996" font-size="9">EID</text><text x="916" y="187" fill="#d8ebef" font-size="11">ipn:3007</text><text x="1034" y="170" fill="#668996" font-size="9">ADDRESS</text><text x="1034" y="187" fill="#d8ebef" font-size="11">203.0.113.7</text><line x1="916" y1="207" x2="1146" y2="207" stroke="#1d3d4d"/><text x="916" y="238" fill="#d8ebef" font-size="13" font-weight="700">Remote actions</text></g>
  <g font-family="Arial, sans-serif" font-size="11"><rect x="916" y="256" width="105" height="64" rx="6" fill="#102d3d" stroke="#2c5668"/><text x="932" y="280" fill="#38bdf8" font-size="18">◌</text><text x="932" y="302" fill="#c8e1e7">Ping host</text><rect x="1034" y="256" width="112" height="64" rx="6" fill="#102d3d" stroke="#2c5668"/><text x="1050" y="280" fill="#38bdf8" font-size="18">≋</text><text x="1050" y="302" fill="#c8e1e7">Request status</text><rect x="916" y="333" width="230" height="74" rx="6" fill="#081823" stroke="#1d3948"/><circle cx="932" cy="355" r="4" fill="#638493"/><text x="944" y="359" fill="#8aa5ae">Select an action to see its</text><text x="944" y="376" fill="#8aa5ae">result here.</text></g>
</svg>
